<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp Outreach With Intelligence preview</title>
  <desc id="desc">Hero mockup showing marketing dashboard with gradient background, stats, and buttons</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083c5d" />
      <stop offset="50%" stop-color="#123f63" />
      <stop offset="100%" stop-color="#1c2d5b" />
    </linearGradient>
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dffa2" />
      <stop offset="100%" stop-color="#47a8ff" />
    </linearGradient>
    <linearGradient id="chartBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffb763" />
      <stop offset="100%" stop-color="#52f2d3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#02101f" flood-opacity="0.4" />
    </filter>
    <filter id="blur" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="36" />
  <circle cx="250" cy="-120" r="260" fill="#35ffd2" opacity="0.18" filter="url(#blur)" />
  <circle cx="980" cy="650" r="220" fill="#4da6ff" opacity="0.18" filter="url(#blur)" />
  <text x="120" y="150" fill="#b7f2ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" letter-spacing="0.2em">WHATSAPPMATE</text>
  <text x="120" y="220" fill="#f8feff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="700">Scale WhatsApp</text>
  <text x="120" y="290" fill="#f8feff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="700">Outreach With</text>
  <text x="120" y="360" fill="#f8feff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="700">Intelligence</text>
  <text x="120" y="410" fill="#d7e9ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" opacity="0.9">
    Design automations, sync contact lists, and monitor performance in real time.
  </text>
  <text x="120" y="445" fill="#d7e9ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" opacity="0.9">
    Ensure every outreach lands with impact using AI copilots and compliance guardrails.
  </text>
  <g filter="url(#shadow)">
    <rect x="120" y="480" width="190" height="64" rx="32" fill="url(#cta)" />
    <text x="180" y="522" text-anchor="middle" fill="#042b3f" font-family="'Inter', sans-serif" font-weight="600" font-size="22">Get Started</text>
    <rect x="330" y="480" width="190" height="64" rx="32" fill="#10273d" stroke="#4da6ff" opacity="0.8" />
    <text x="425" y="522" text-anchor="middle" fill="#d3ecff" font-family="'Inter', sans-serif" font-weight="600" font-size="22">View Demo</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="140" width="380" height="360" rx="32" fill="#0c1c33" opacity="0.95" />
    <text x="690" y="190" fill="#f8feff" font-family="'Inter', sans-serif" font-size="26" font-weight="600">Campaign Pulse</text>
    <g fill="none" stroke="#1c314c" stroke-width="2">
      <rect x="680" y="210" width="320" height="230" rx="24" />
    </g>
    <g>
      <text x="720" y="250" fill="#7fdcff" font-family="'Inter', sans-serif" font-size="18">Delivered</text>
      <circle cx="702" cy="244" r="6" fill="#47ffc3" />
      <text x="850" y="250" fill="#ffcf87" font-family="'Inter', sans-serif" font-size="18">Replies</text>
      <circle cx="832" cy="244" r="6" fill="#ffb763" />
    </g>
    <g>
      <rect x="720" y="280" width="36" height="110" rx="8" fill="url(#chartBar)" />
      <rect x="780" y="305" width="36" height="135" rx="8" fill="url(#chartBar)" opacity="0.9" />
      <rect x="840" y="330" width="36" height="85" rx="8" fill="url(#chartBar)" opacity="0.8" />
      <rect x="900" y="285" width="36" height="160" rx="8" fill="url(#chartBar)" />
      <rect x="960" y="310" width="36" height="120" rx="8" fill="url(#chartBar)" opacity="0.85" />
      <text x="738" y="420" text-anchor="middle" fill="#a6b3d1" font-family="'Inter', sans-serif" font-size="18">MON</text>
      <text x="798" y="420" text-anchor="middle" fill="#a6b3d1" font-family="'Inter', sans-serif" font-size="18">TUE</text>
      <text x="858" y="420" text-anchor="middle" fill="#a6b3d1" font-family="'Inter', sans-serif" font-size="18">WED</text>
      <text x="918" y="420" text-anchor="middle" fill="#a6b3d1" font-family="'Inter', sans-serif" font-size="18">THU</text>
      <text x="978" y="420" text-anchor="middle" fill="#a6b3d1" font-family="'Inter', sans-serif" font-size="18">FRI</text>
    </g>
    <g>
      <rect x="690" y="460" width="100" height="70" rx="20" fill="#132845" />
      <text x="740" y="500" text-anchor="middle" fill="#7fdcff" font-family="'Inter', sans-serif" font-size="18">Campaigns</text>
      <text x="740" y="525" text-anchor="middle" fill="#f8feff" font-family="'Inter', sans-serif" font-size="26" font-weight="600">12</text>
      <rect x="810" y="460" width="130" height="70" rx="20" fill="#132845" />
      <text x="875" y="500" text-anchor="middle" fill="#7fdcff" font-family="'Inter', sans-serif" font-size="18">Msgs Sent</text>
      <text x="875" y="525" text-anchor="middle" fill="#f8feff" font-family="'Inter', sans-serif" font-size="26" font-weight="600">48,320</text>
      <rect x="960" y="460" width="100" height="70" rx="20" fill="#132845" />
      <text x="1010" y="500" text-anchor="middle" fill="#7fdcff" font-family="'Inter', sans-serif" font-size="18">Reply %</text>
      <text x="1010" y="525" text-anchor="middle" fill="#f8feff" font-family="'Inter', sans-serif" font-size="26" font-weight="600">27%</text>
    </g>
  </g>
</svg>
